name: collect

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Backfill run whose artifacts should be committed"
        required: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts one by one (avoids secondary rate limits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tmp_artifacts
          names=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/artifacts?per_page=100" --jq '.artifacts[].name')
          for n in $names; do
            for attempt in 1 2 3 4 5; do
              gh run download "${{ inputs.run_id }}" -n "$n" -D "tmp_artifacts/$n" && break
              sleep $((attempt * 20))
            done
            sleep 1
          done
          find tmp_artifacts -name '*.parquet' -exec cp -n {} data/daily/ \;
          rm -rf tmp_artifacts
      - name: Commit summaries
        run: |
          ls data/daily | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          git diff --cached --quiet || git commit -m "data: collect run ${{ inputs.run_id }}"
          git pull --rebase -q
          git push
