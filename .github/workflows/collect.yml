name: collect

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Backfill run whose artifacts should be committed"
        required: true

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: days-*
          merge-multiple: true
          path: data/daily
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Commit summaries
        run: |
          ls data/daily | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily
          git diff --cached --quiet || git commit -m "data: collect run ${{ inputs.run_id }}"
          git pull --rebase -q
          git push
